<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반짝반짝 그림자 탐정단 🔦</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti for winning celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Tone.js for kid-friendly playful sound synthesis -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <!-- FontAwesome for cute icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Round&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Jua', 'Nanum Round', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .game-shadow-drop {
      filter: drop-shadow(0 15px 15px rgba(0,0,0,0.25));
    }
    .slider-thumb::-webkit-slider-thumb {
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FBBF24;
      cursor: pointer;
      border: 3px solid #FFF;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
    }
    .animated-pulse-glow {
      animation: pulseGlow 2s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 10px #fbbf24); }
      100% { filter: drop-shadow(0 0 25px #f59e0b); }
    }
  </style>
</head>
<body class="bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-900 min-h-screen text-slate-100 flex flex-col items-center p-3 md:p-6 overflow-x-hidden">

  <!-- Top Navigation & Scoreboard -->
  <header class="w-full max-w-4xl flex flex-wrap items-center justify-between gap-3 bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/20 game-shadow-drop mb-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-amber-400 rounded-2xl flex items-center justify-center text-2xl text-amber-950 shadow-inner">
        🔦
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl text-amber-300 font-bold tracking-wide">그림자 과학 탐정단</h1>
        <p class="text-xs md:text-sm text-indigo-200">초등학교 과학: 빛과 그림자의 신비한 원리!</p>
      </div>
    </div>

    <!-- Mode Selector & Sound Toggle -->
    <div class="flex items-center gap-2">
      <button id="btnSoundToggle" class="px-3 py-2 bg-indigo-800/80 hover:bg-indigo-700 text-amber-300 rounded-2xl border border-indigo-400/40 text-sm flex items-center gap-1 transition">
        <i class="fa-solid fa-volume-high" id="soundIcon"></i>
        <span id="soundText" class="hidden sm:inline">소리 켬</span>
      </button>
      <div class="inline-flex rounded-2xl bg-indigo-900/80 p-1 border border-indigo-400/30">
        <button id="navModeExp" class="px-3 md:px-4 py-1.5 rounded-xl text-sm md:text-base font-bold bg-amber-400 text-indigo-950 shadow transition">
          🔬 자유 실험실
        </button>
        <button id="navModeQuiz" class="px-3 md:px-4 py-1.5 rounded-xl text-sm md:text-base font-bold text-indigo-200 hover:text-white transition">
          🕵️ 그림자 퀴즈
        </button>
      </div>
    </div>
  </header>

  <main class="w-full max-w-4xl flex-1 flex flex-col gap-4">

    <!-- TAB 1: 그림자 과학 자유 실험실 (Interactive Lab) -->
    <section id="experimentSection" class="flex flex-col gap-4">
      <!-- Science Explanation Banner for Elementary Kids -->
      <div class="bg-amber-400/10 border border-amber-400/30 rounded-2xl p-3 px-4 flex items-center gap-3 text-sm md:text-base text-amber-200">
        <span class="text-2xl">💡</span>
        <span id="scienceTip">손전등을 물체 가까이 가져가면 그림자가 <strong>엄청 커져요!</strong> 멀리 가면 <strong>작아져요!</strong></span>
      </div>

      <!-- Simulation Playground -->
      <div class="relative w-full h-[400px] md:h-[480px] bg-slate-900/80 rounded-3xl border-2 border-indigo-500/40 overflow-hidden shadow-2xl flex flex-col justify-end" id="labCanvasArea">
        
        <!-- Background Wallpaper Grid & Wall -->
        <div class="absolute inset-0 bg-gradient-to-b from-indigo-950/60 to-slate-950 pointer-events-none"></div>
        <div class="absolute top-4 left-6 text-xs text-indigo-400 tracking-wider">
          <i class="fa-solid fa-info-circle mr-1"></i> 화면의 손전등 🔦 아이콘을 손가락이나 마우스로 자유롭게 움직여보세요!
        </div>

        <!-- Canvas for drawing rays and dynamic shadows -->
        <canvas id="labCanvas" class="absolute inset-0 w-full h-full z-10"></canvas>

        <!-- Floor representation -->
        <div class="w-full h-16 bg-gradient-to-t from-slate-950 to-slate-900/90 border-t border-indigo-700/50 z-20 flex items-center justify-between px-6 text-xs text-slate-400">
          <span>바닥 스크린 📐</span>
          <span id="distanceIndicator">물체와 거리: 보통</span>
        </div>
      </div>

      <!-- Object Selectors & Controls -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-white/5 p-4 rounded-3xl border border-white/10 backdrop-blur-md">
        <!-- Object Picker -->
        <div class="flex flex-col gap-2">
          <label class="text-sm text-indigo-300 font-bold flex items-center gap-2">
            <span>🧸 실험할 물체 고르기</span>
          </label>
          <div class="grid grid-cols-4 gap-2" id="objectPicker">
            <button data-obj="bear" class="obj-btn py-2 bg-amber-500 text-white rounded-xl text-xl flex items-center justify-center border-2 border-amber-300 shadow">🧸</button>
            <button data-obj="tree" class="obj-btn py-2 bg-indigo-900/70 hover:bg-indigo-800 text-white rounded-xl text-xl flex items-center justify-center border border-indigo-500/30">🌲</button>
            <button data-obj="dino" class="obj-btn py-2 bg-indigo-900/70 hover:bg-indigo-800 text-white rounded-xl text-xl flex items-center justify-center border border-indigo-500/30">🦖</button>
            <button data-obj="star" class="obj-btn py-2 bg-indigo-900/70 hover:bg-indigo-800 text-white rounded-xl text-xl flex items-center justify-center border border-indigo-500/30">⭐</button>
          </div>
        </div>

        <!-- Light Brightness / Size Slider -->
        <div class="flex flex-col gap-2">
          <label class="text-sm text-indigo-300 font-bold flex items-center justify-between">
            <span>💡 손전등 빛 밝기</span>
            <span id="lightPowerText" class="text-amber-400">100%</span>
          </label>
          <input type="range" id="lightBrightness" min="40" max="150" value="100" class="w-full h-3 bg-indigo-950 rounded-lg appearance-none slider-thumb mt-2">
        </div>

        <!-- Quick Experiment Presets -->
        <div class="flex flex-col gap-2">
          <label class="text-sm text-indigo-300 font-bold">⚡ 과학 미션 바로보기</label>
          <div class="flex gap-2">
            <button id="btnMissionClose" class="flex-1 py-2 px-2 bg-indigo-800/80 hover:bg-amber-500 hover:text-slate-900 rounded-xl text-xs md:text-sm font-bold border border-indigo-400/40 transition">
              가까이! (그림자 커짐)
            </button>
            <button id="btnMissionFar" class="flex-1 py-2 px-2 bg-indigo-800/80 hover:bg-amber-500 hover:text-slate-900 rounded-xl text-xs md:text-sm font-bold border border-indigo-400/40 transition">
              멀리! (그림자 작아짐)
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 2: 그림자 추리 퀴즈 (Quiz Game) -->
    <section id="quizSection" class="hidden flex-col gap-4">
      <!-- Quiz Header & Progress -->
      <div class="flex items-center justify-between bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/20">
        <div class="flex items-center gap-3">
          <div class="px-3 py-1 bg-amber-400 text-slate-950 font-bold rounded-xl text-sm" id="quizLevelBadge">
            문제 1 / 5
          </div>
          <h2 class="text-lg md:text-xl font-bold text-indigo-100" id="quizQuestionText">
            어떤 친구의 그림자일까요?
          </h2>
        </div>
        <div class="flex items-center gap-2 font-bold text-amber-300 text-lg">
          <i class="fa-solid fa-trophy text-amber-400"></i>
          <span>점수: <span id="quizScore">0</span>점</span>
        </div>
      </div>

      <!-- Quiz Stage Display -->
      <div class="relative w-full h-[360px] md:h-[420px] bg-slate-900/90 rounded-3xl border-2 border-amber-400/30 flex flex-col items-center justify-center p-6 overflow-hidden">
        
        <!-- Light projector effect on stage -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(251,191,36,0.18)_0%,_rgba(15,23,42,0.95)_75%)] pointer-events-none"></div>

        <!-- Big Mystery Shadow Silhouette -->
        <div id="quizShadowDisplay" class="relative z-10 text-[130px] md:text-[180px] filter drop-shadow-[0_10px_20px_rgba(0,0,0,0.9)] text-slate-950 transition-transform duration-500 transform hover:scale-105">
          ❓
        </div>

        <!-- Hint Banner -->
        <div id="quizHintText" class="z-10 mt-2 px-4 py-1.5 bg-indigo-900/80 border border-indigo-400/40 text-indigo-200 text-sm md:text-base rounded-full shadow">
          힌트: 귀여운 날개를 파닥거려요!
        </div>
      </div>

      <!-- Multiple Choice Options -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="quizOptionsContainer">
        <!-- Buttons rendered via JS -->
      </div>

      <!-- Feedback Banner (Pop-up/Banner) -->
      <div id="quizFeedback" class="hidden rounded-2xl p-4 text-center font-bold text-base md:text-lg transition-all">
      </div>
    </section>

  </main>

  <!-- Celebration Modal -->
  <div id="winModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gradient-to-b from-indigo-900 to-purple-950 border-2 border-amber-400 rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl">
      <div class="text-6xl mb-3">🎓🕵️‍♂️</div>
      <h3 class="text-3xl font-bold text-amber-300 mb-2">그림자 과학 박사 탄생!</h3>
      <p id="winModalMsg" class="text-indigo-200 mb-6 text-base">모든 퀴즈를 맞히고 빛과 그림자의 비밀을 모두 풀었어요!</p>
      
      <div class="bg-white/10 rounded-2xl p-4 mb-6 border border-white/20">
        <p class="text-amber-200 text-sm">최종 획득 점수</p>
        <p class="text-4xl font-extrabold text-white mt-1" id="modalFinalScore">100점</p>
      </div>

      <div class="flex gap-3">
        <button id="btnRestartQuiz" class="flex-1 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 rounded-2xl font-bold text-lg shadow-lg transition">
          다시 도전하기 🔄
        </button>
        <button id="btnBackToLab" class="flex-1 py-3 bg-indigo-700 hover:bg-indigo-600 text-white rounded-2xl font-bold text-lg border border-indigo-400 transition">
          실험실 가기 🔬
        </button>
      </div>
    </div>
  </div>

  <script>
    /* -------------------------------------------------------------
       AUDIO SYNTHESIS (Tone.js)
       Kid-friendly, pleasant synth notes without external audio files
       ------------------------------------------------------------- */
    let soundEnabled = true;
    let synth, correctSynth, wrongSynth;

    function initAudio() {
      if (!synth) {
        try {
          synth = new Tone.PolySynth(Tone.Synth).toDestination();
          synth.volume.value = -8;

          correctSynth = new Tone.Synth({
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5 }
          }).toDestination();
          correctSynth.volume.value = -5;

          wrongSynth = new Tone.Synth({
            oscillator: { type: 'sawtooth' },
            envelope: { attack: 0.05, decay: 0.3, sustain: 0, release: 0.2 }
          }).toDestination();
          wrongSynth.volume.value = -10;
        } catch(e) {
          console.warn("Audio Context init fallback:", e);
        }
      }
    }

    function playTone(type) {
      if (!soundEnabled) return;
      initAudio();
      try {
        if (Tone.context.state !== 'running') {
          Tone.context.resume();
        }
        if (type === 'pop') {
          synth.triggerAttackRelease(["C5"], "16n");
        } else if (type === 'correct') {
          const now = Tone.now();
          correctSynth.triggerAttackRelease("C5", "8n", now);
          correctSynth.triggerAttackRelease("E5", "8n", now + 0.1);
          correctSynth.triggerAttackRelease("G5", "4n", now + 0.2);
        } else if (type === 'wrong') {
          wrongSynth.triggerAttackRelease("B2", "8n");
        } else if (type === 'victory') {
          const now = Tone.now();
          synth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
          synth.triggerAttackRelease(["F5", "A5", "C6"], "8n", now + 0.2);
          synth.triggerAttackRelease(["G5", "B5", "D6"], "4n", now + 0.4);
          synth.triggerAttackRelease(["C6", "E6", "G6"], "2n", now + 0.6);
        }
      } catch(err) {
        // gracefully ignore sound limitations on strict mobile browsers
      }
    }

    const soundToggleBtn = document.getElementById('btnSoundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');

    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIcon.className = "fa-solid fa-volume-high";
        soundText.textContent = "소리 켬";
        playTone('pop');
      } else {
        soundIcon.className = "fa-solid fa-volume-xmark";
        soundText.textContent = "소리 끔";
      }
    });

    /* -------------------------------------------------------------
       MODE SWITCHING (LAB vs QUIZ)
       ------------------------------------------------------------- */
    const navModeExp = document.getElementById('navModeExp');
    const navModeQuiz = document.getElementById('navModeQuiz');
    const experimentSection = document.getElementById('experimentSection');
    const quizSection = document.getElementById('quizSection');

    navModeExp.addEventListener('click', () => {
      playTone('pop');
      navModeExp.className = "px-3 md:px-4 py-1.5 rounded-xl text-sm md:text-base font-bold bg-amber-400 text-indigo-950 shadow transition";
      navModeQuiz.className = "px-3 md:px-4 py-1.5 rounded-xl text-sm md:text-base font-bold text-indigo-200 hover:text-white transition";
      experimentSection.classList.remove('hidden');
      quizSection.classList.add('hidden');
      resizeLabCanvas();
    });

    navModeQuiz.addEventListener('click', () => {
      playTone('pop');
      navModeQuiz.className = "px-3 md:px-4 py-1.5 rounded-xl text-sm md:text-base font-bold bg-amber-400 text-indigo-950 shadow transition";
      navModeExp.className = "px-3 md:px-4 py-1.5 rounded-xl text-sm md:text-base font-bold text-indigo-200 hover:text-white transition";
      quizSection.classList.remove('hidden');
      experimentSection.classList.add('hidden');
      initQuiz();
    });

    /* -------------------------------------------------------------
       LAB CANVAS SIMULATION: REAL-TIME LIGHT & SHADOW PHYSICS
       ------------------------------------------------------------- */
    const labCanvas = document.getElementById('labCanvas');
    const labCtx = labCanvas.getContext('2d');
    const labArea = document.getElementById('labCanvasArea');
    const scienceTip = document.getElementById('scienceTip');
    const distanceIndicator = document.getElementById('distanceIndicator');

    // Object SVG representations with scalable vector paths
    const LAB_OBJECTS = {
      bear: {
        name: "아기 곰",
        emoji: "🧸",
        draw: (ctx, x, y, size, isShadow = false) => {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = isShadow ? "rgba(10, 10, 25, 0.85)" : "#d97706";
          
          // Body & Head
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 0.45, size * 0.5, 0, 0, Math.PI * 2);
          ctx.fill();

          // Ears
          ctx.beginPath();
          ctx.arc(-size * 0.35, -size * 0.42, size * 0.18, 0, Math.PI * 2);
          ctx.arc(size * 0.35, -size * 0.42, size * 0.18, 0, Math.PI * 2);
          ctx.fill();

          // Muzzle / Feet
          ctx.beginPath();
          ctx.ellipse(0, size * 0.1, size * 0.22, size * 0.18, 0, 0, Math.PI * 2);
          if (isShadow) {
            ctx.fill();
          } else {
            ctx.fillStyle = "#fbbf24";
            ctx.fill();
            // Eyes
            ctx.fillStyle = "#1e1b4b";
            ctx.beginPath();
            ctx.arc(-size * 0.12, -size * 0.1, size * 0.05, 0, Math.PI * 2);
            ctx.arc(size * 0.12, -size * 0.1, size * 0.05, 0, Math.PI * 2);
            ctx.fill();
            // Nose
            ctx.beginPath();
            ctx.arc(0, size * 0.05, size * 0.06, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      },
      tree: {
        name: "푸른 나무",
        emoji: "🌲",
        draw: (ctx, x, y, size, isShadow = false) => {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = isShadow ? "rgba(10, 10, 25, 0.85)" : "#854d0e";
          // Trunk
          ctx.fillRect(-size * 0.12, size * 0.1, size * 0.24, size * 0.45);

          // Foliage Triangles
          ctx.fillStyle = isShadow ? "rgba(10, 10, 25, 0.85)" : "#15803d";
          for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            const topY = -size * 0.5 + i * (size * 0.22);
            ctx.moveTo(0, topY);
            ctx.lineTo(-size * (0.35 + i * 0.12), topY + size * 0.4);
            ctx.lineTo(size * (0.35 + i * 0.12), topY + size * 0.4);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }
      },
      dino: {
        name: "아기 공룡",
        emoji: "🦖",
        draw: (ctx, x, y, size, isShadow = false) => {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = isShadow ? "rgba(10, 10, 25, 0.85)" : "#059669";
          // Body
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 0.4, size * 0.35, 0, 0, Math.PI * 2);
          ctx.fill();
          // Neck & Head
          ctx.beginPath();
          ctx.ellipse(size * 0.35, -size * 0.3, size * 0.22, size * 0.18, 0.3, 0, Math.PI * 2);
          ctx.fill();
          // Tail
          ctx.beginPath();
          ctx.moveTo(-size * 0.3, 0);
          ctx.lineTo(-size * 0.7, -size * 0.1);
          ctx.lineTo(-size * 0.3, size * 0.2);
          ctx.closePath();
          ctx.fill();
          // Legs
          ctx.fillRect(-size * 0.2, size * 0.2, size * 0.12, size * 0.3);
          ctx.fillRect(size * 0.1, size * 0.2, size * 0.12, size * 0.3);
          ctx.restore();
        }
      },
      star: {
        name: "빛나는 별",
        emoji: "⭐",
        draw: (ctx, x, y, size, isShadow = false) => {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = isShadow ? "rgba(10, 10, 25, 0.85)" : "#eab308";
          ctx.beginPath();
          const spikes = 5;
          const outerRadius = size * 0.5;
          const innerRadius = size * 0.22;
          let rot = (Math.PI / 2) * 3;
          let step = Math.PI / spikes;
          ctx.moveTo(0, -outerRadius);
          for (let i = 0; i < spikes; i++) {
            let px = Math.cos(rot) * outerRadius;
            let py = Math.sin(rot) * outerRadius;
            ctx.lineTo(px, py);
            rot += step;
            px = Math.cos(rot) * innerRadius;
            py = Math.sin(rot) * innerRadius;
            ctx.lineTo(px, py);
            rot += step;
          }
          ctx.lineTo(0, -outerRadius);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
    };

    let currentObjKey = 'bear';
    let light = { x: 140, y: 150, radius: 36, dragging: false, brightness: 100 };
    let labObject = { x: 340, y: 280, baseSize: 75 };
    let screenWallX = 0; // Dynamic right edge

    function resizeLabCanvas() {
      const rect = labArea.getBoundingClientRect();
      labCanvas.width = rect.width;
      labCanvas.height = rect.height;
      screenWallX = labCanvas.width - 45;

      // Ensure object stays anchored on floor
      labObject.x = labCanvas.width * 0.48;
      labObject.y = labCanvas.height - 90;

      // Keep light in reasonable default if off-screen
      if (light.x > labObject.x - 40) {
        light.x = Math.max(70, labObject.x - 140);
      }
      drawLab();
    }
    window.addEventListener('resize', resizeLabCanvas);

    function getPointerPos(evt) {
      const rect = labCanvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function isInsideLight(pos) {
      const dx = pos.x - light.x;
      const dy = pos.y - light.y;
      return Math.sqrt(dx * dx + dy * dy) <= light.radius + 15;
    }

    function onPointerDown(e) {
      const pos = getPointerPos(e);
      if (isInsideLight(pos)) {
        light.dragging = true;
        playTone('pop');
      }
    }

    function onPointerMove(e) {
      if (!light.dragging) return;
      const pos = getPointerPos(e);
      
      // Restrict light movement: can't pass the object to the right, can't leave canvas
      light.x = Math.max(50, Math.min(labObject.x - 60, pos.x));
      light.y = Math.max(50, Math.min(labCanvas.height - 110, pos.y));
      drawLab();
      updateScientificTips();
    }

    function onPointerUp() {
      light.dragging = false;
    }

    labCanvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    labCanvas.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    function updateScientificTips() {
      const dist = labObject.x - light.x;
      if (dist < 110) {
        scienceTip.innerHTML = "🌟 <strong>빛이 물체와 아주 가까워요!</strong> 그림자가 벽면에 <strong>거대하게</strong> 커졌어요!";
        distanceIndicator.innerHTML = "물체와 거리: <span class='text-amber-400 font-bold'>매우 가까움 (그림자 왕커짐!)</span>";
      } else if (dist > 220) {
        scienceTip.innerHTML = "🔍 <strong>빛이 물체에서 멀어졌어요!</strong> 그림자의 크기가 <strong>작고 선명해져요!</strong>";
        distanceIndicator.innerHTML = "물체와 거리: <span class='text-sky-300 font-bold'>멀어짐 (그림자 작아짐)</span>";
      } else {
        scienceTip.innerHTML = "💡 손전등을 <strong>가까이/멀리</strong> 이동하며 그림자의 크기 변화를 관찰해 보세요.";
        distanceIndicator.innerHTML = "물체와 거리: <span>보통</span>";
      }
    }

    function drawLab() {
      if (!labCtx || labCanvas.width === 0) return;
      labCtx.clearRect(0, 0, labCanvas.width, labCanvas.height);

      const obj = LAB_OBJECTS[currentObjKey];
      const objX = labObject.x;
      const objY = labObject.y;
      const objSize = labObject.baseSize;

      // 1. Calculate Shadow Projection using Geometric Ray Casting
      // Distance between Light and Object
      const dx = objX - light.x;
      const dy = objY - light.y;
      const distToObject = Math.max(30, dx);

      // Distance from object to screen wall
      const distToWall = screenWallX - objX;

      // Magnification factor: (distance to wall / distance to light)
      const scaleFactor = Math.min(3.2, Math.max(0.65, 1 + (distToWall / distToObject) * 0.9));
      const shadowSize = objSize * scaleFactor;

      // Vertical shadow position based on light angle
      const slope = dy / distToObject;
      const shadowY = Math.min(labCanvas.height - 80, Math.max(90, objY + slope * distToWall));

      // 2. Render Light Beams (직진하는 빛의 경로)
      labCtx.save();
      const beamGrad = labCtx.createRadialGradient(
        light.x, light.y, 10,
        screenWallX, shadowY, labCanvas.width
      );
      const intensity = light.brightness / 100;
      beamGrad.addColorStop(0, `rgba(254, 240, 138, ${0.45 * intensity})`);
      beamGrad.addColorStop(0.4, `rgba(253, 224, 71, ${0.25 * intensity})`);
      beamGrad.addColorStop(1, "rgba(250, 204, 21, 0.02)");

      labCtx.fillStyle = beamGrad;
      labCtx.beginPath();
      // Ray to top and bottom of screen wall
      const angleTop = Math.atan2((objY - objSize * 0.5) - light.y, (objX - objSize * 0.4) - light.x);
      const angleBottom = Math.atan2((objY + objSize * 0.5) - light.y, (objX - objSize * 0.4) - light.x);

      labCtx.moveTo(light.x, light.y);
      labCtx.lineTo(labCanvas.width, light.y + Math.tan(angleTop) * (labCanvas.width - light.x));
      labCtx.lineTo(labCanvas.width, light.y + Math.tan(angleBottom) * (labCanvas.width - light.x));
      labCtx.closePath();
      labCtx.fill();
      labCtx.restore();

      // 3. Draw Screen / Wall on Right Side
      labCtx.fillStyle = "rgba(30, 41, 59, 0.95)";
      labCtx.fillRect(screenWallX, 20, 35, labCanvas.height - 70);
      labCtx.strokeStyle = "rgba(129, 140, 248, 0.5)";
      labCtx.lineWidth = 3;
      labCtx.strokeRect(screenWallX, 20, 35, labCanvas.height - 70);

      // 4. Draw Shadow on the Screen (Wall)
      labCtx.save();
      // Clip to screen wall zone so shadow appears cast strictly on wall
      labCtx.beginPath();
      labCtx.rect(screenWallX - 25, 20, 70, labCanvas.height - 70);
      labCtx.clip();

      // Draw projected shadow
      obj.draw(labCtx, screenWallX + 8, shadowY, shadowSize, true);
      labCtx.restore();

      // 5. Draw Light Rays Lines (Visualizing Light Straight Line Principle - 빛의 직진)
      labCtx.strokeStyle = "rgba(251, 191, 36, 0.35)";
      labCtx.lineWidth = 1.5;
      labCtx.setLineDash([5, 5]);

      // Top guide line
      labCtx.beginPath();
      labCtx.moveTo(light.x, light.y);
      labCtx.lineTo(screenWallX, shadowY - shadowSize * 0.45);
      labCtx.stroke();

      // Bottom guide line
      labCtx.beginPath();
      labCtx.moveTo(light.x, light.y);
      labCtx.lineTo(screenWallX, shadowY + shadowSize * 0.45);
      labCtx.stroke();
      labCtx.setLineDash([]);

      // 6. Draw Actual Object in Middle
      // Pedestal for the object
      labCtx.fillStyle = "#334155";
      labCtx.fillRect(objX - 25, objY + objSize * 0.42, 50, labCanvas.height - (objY + objSize * 0.42) - 60);
      // Object shape
      obj.draw(labCtx, objX, objY, objSize, false);

      // 7. Draw Flashlight (광원)
      labCtx.save();
      // Glow circle
      const flashGlow = labCtx.createRadialGradient(light.x, light.y, 5, light.x, light.y, light.radius + 15);
      flashGlow.addColorStop(0, "rgba(254, 243, 199, 0.9)");
      flashGlow.addColorStop(0.5, "rgba(251, 191, 36, 0.4)");
      flashGlow.addColorStop(1, "rgba(251, 191, 36, 0)");
      labCtx.fillStyle = flashGlow;
      labCtx.beginPath();
      labCtx.arc(light.x, light.y, light.radius + 15, 0, Math.PI * 2);
      labCtx.fill();

      // Flashlight Body Icon / Drawing
      labCtx.fillStyle = "#f59e0b";
      labCtx.beginPath();
      labCtx.arc(light.x, light.y, 22, 0, Math.PI * 2);
      labCtx.fill();
      labCtx.lineWidth = 3;
      labCtx.strokeStyle = "#fff";
      labCtx.stroke();

      // Flashlight Emoji Text
      labCtx.font = "22px sans-serif";
      labCtx.textAlign = "center";
      labCtx.textBaseline = "middle";
      labCtx.fillText("🔦", light.x, light.y);

      // Label under flashlight
      labCtx.font = "12px 'Jua', sans-serif";
      labCtx.fillStyle = "#fde047";
      labCtx.fillText("손전등(드래그)", light.x, light.y + 36);
      labCtx.restore();
    }

    // Lab Object Selection
    const objButtons = document.querySelectorAll('.obj-btn');
    objButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        playTone('pop');
        objButtons.forEach(b => {
          b.className = "obj-btn py-2 bg-indigo-900/70 hover:bg-indigo-800 text-white rounded-xl text-xl flex items-center justify-center border border-indigo-500/30";
        });
        btn.className = "obj-btn py-2 bg-amber-500 text-white rounded-xl text-xl flex items-center justify-center border-2 border-amber-300 shadow";
        currentObjKey = btn.dataset.obj;
        drawLab();
      });
    });

    // Brightness Slider
    const lightBrightness = document.getElementById('lightBrightness');
    const lightPowerText = document.getElementById('lightPowerText');
    lightBrightness.addEventListener('input', (e) => {
      light.brightness = parseInt(e.target.value);
      lightPowerText.textContent = `${light.brightness}%`;
      drawLab();
    });

    // Preset Buttons
    document.getElementById('btnMissionClose').addEventListener('click', () => {
      playTone('pop');
      light.x = labObject.x - 90;
      light.y = labObject.y - 40;
      drawLab();
      updateScientificTips();
    });

    document.getElementById('btnMissionFar').addEventListener('click', () => {
      playTone('pop');
      light.x = 90;
      light.y = labObject.y;
      drawLab();
      updateScientificTips();
    });

    /* -------------------------------------------------------------
       QUIZ MODE DATA & MECHANICS
       Carefully designed for elementary school science curriculums:
       - Silhouette recognition
       - Shadow size relative to distance
       - Transparent vs opaque shadows
       ------------------------------------------------------------- */
    const QUIZ_QUESTIONS = [
      {
        type: 'silhouette',
        title: "누구의 그림자일까요?",
        shadowEmoji: "🐘",
        hint: "코가 길고 귀가 펄럭이는 커다란 동물 친구예요!",

        ],

        title: "하늘을 나는 이 친구의 그림자는 누구일까요?",
        shadowEmoji: "🦋",
        hint: "꽃을 찾아 훨훨 날아다니는 아름다운 곤충이에요!",
        options: [
          { label: "개미", emoji: "🐜", correct: false },
          { label: "나비", emoji: "🦋", correct: true },
          { label: "달팽이", emoji: "🐌", correct: false },
          { label: "무당벌레", emoji: "🐞", correct: false }
        ],
        explanation: "정답! 나비의 양쪽 날개 모양 그림자였어요."
      },
      {
        type: 'science',
        title: "그림자를 [더 크게] 만들려면 손전등을 어떻게 해야 할까요?",
        shadowEmoji: "🔍",
        hint: "아까 실험실에서 손전등을 물체에 어떻게 했었죠?",
        options: [
          { label: "물체에 가까이 가져간다", emoji: "👉", correct: true },
          { label: "물체에서 멀리 치운다", emoji: "👈", correct: false },
          { label: "손전등을 꺼버린다", emoji: "🌑", correct: false },
          { label: "그림자는 항상 크기가 같다", emoji: "❌", correct: false }
        ],
        explanation: "훌륭해요! 손전등이 물체에 가까울수록 빛을 더 많이 가려서 그림자가 커져요!"
      },
      {
        type: 'science',
        title: "빛이 투명한 유리를 만나면 그림자는 어떻게 될까요?",
        shadowEmoji: "🥛",
        hint: "빛은 투명한 물체를 어떻게 통과할까요?",
        options: [
          { label: "빛이 통과해서 거의 안 생긴다", emoji: "✨", correct: true },
          { label: "새까만 그림자가 생긴다", emoji: "⬛", correct: false },
          { label: "무지개색 그림자가 폭발한다", emoji: "🌈", correct: false },
          { label: "손전등이 깨진다", emoji: "💥", correct: false }
        ],
        explanation: "정답! 투명한 물체는 빛이 그대로 통과하여 그림자가 거의 생기지 않아요!"
      },
      {

        shadowEmoji: "🦀",
        hint: "집게발을 들고 옆으로 걸어 다녀요!",
        options: [
          { label: "물고기", emoji: "🐟", correct: false },
          { label: "꽃게", emoji: "🦀", correct: true },
          { label: "해파리", emoji: "🪼", correct: false },
          { label: "문어", emoji: "🐙", correct: false }
        ],
        explanation: "최고예요! 양쪽에 뾰족한 집게발이 선명한 꽃게였습니다!"
      }
    ];

    let currentQuizIndex = 0;
    let quizScore = 0;
    let quizLocked = false;

    const quizLevelBadge = document.getElementById('quizLevelBadge');
    const quizQuestionText = document.getElementById('quizQuestionText');
    const quizShadowDisplay = document.getElementById('quizShadowDisplay');
    const quizHintText = document.getElementById('quizHintText');
    const quizOptionsContainer = document.getElementById('quizOptionsContainer');
    const quizFeedback = document.getElementById('quizFeedback');
    const quizScoreText = document.getElementById('quizScore');

    const winModal = document.getElementById('winModal');
    const modalFinalScore = document.getElementById('modalFinalScore');
    const btnRestartQuiz = document.getElementById('btnRestartQuiz');
    const btnBackToLab = document.getElementById('btnBackToLab');

    function initQuiz() {
      currentQuizIndex = 0;
      quizScore = 0;
      quizScoreText.textContent = "0";
      quizLocked = false;
      winModal.classList.add('hidden');
      loadQuizQuestion(currentQuizIndex);
    }

    function loadQuizQuestion(index) {
      if (index >= QUIZ_QUESTIONS.length) {
        showVictoryScreen();
        return;
      }

      quizLocked = false;
      const q = QUIZ_QUESTIONS[index];
      quizLevelBadge.textContent = `문제 ${index + 1} / ${QUIZ_QUESTIONS.length}`;
      quizQuestionText.textContent = q.title;
      quizHintText.innerHTML = `💡 힌트: ${q.hint}`;

      // Reset & Hide feedback
      quizFeedback.classList.add('hidden');
      quizFeedback.className = "hidden rounded-2xl p-4 text-center font-bold text-base md:text-lg transition-all";

      // Shadow silhouette styling
      quizShadowDisplay.textContent = q.shadowEmoji;
      quizShadowDisplay.style.filter = "drop-shadow(0 0 0px #000) brightness(0)";
      quizShadowDisplay.style.transform = "scale(1)";

      // Render Options
      quizOptionsContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "quiz-choice-btn p-4 bg-white/10 hover:bg-white/20 active:scale-95 border-2 border-indigo-400/30 rounded-2xl flex flex-col items-center justify-center gap-2 font-bold text-white transition shadow-lg text-sm md:text-base";
        btn.innerHTML = `
          <span class="text-3xl md:text-4xl filter drop-shadow">${opt.emoji}</span>
          <span>${opt.label}</span>
        `;
        btn.addEventListener('click', () => handleQuizAnswer(opt, btn, q));
        quizOptionsContainer.appendChild(btn);
      });
    }

    function handleQuizAnswer(selectedOption, buttonElement, questionData) {
      if (quizLocked) return;
      quizLocked = true;

      // Reveal original silhouette colors
      quizShadowDisplay.style.filter = "drop-shadow(0 10px 15px rgba(251,191,36,0.5)) brightness(1)";
      quizShadowDisplay.style.transform = "scale(1.15)";

      const allButtons = quizOptionsContainer.querySelectorAll('button');

      if (selectedOption.correct) {
        // Correct Answer
        playTone('correct');
        quizScore += 20;
        quizScoreText.textContent = quizScore;
        buttonElement.classList.remove('bg-white/10', 'border-indigo-400/30');
        buttonElement.classList.add('bg-emerald-500', 'border-emerald-300', 'text-white');

        // Confetti burst for kids encouragement
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.6 }
          });
        }

        quizFeedback.className = "block bg-emerald-600/90 border-2 border-emerald-300 text-white rounded-2xl p-4 text-center font-bold text-base md:text-lg transition-all";
        quizFeedback.innerHTML = `🎉 정답입니다! ${questionData.explanation}`;
      } else {
        // Wrong Answer
        playTone('wrong');
        buttonElement.classList.remove('bg-white/10', 'border-indigo-400/30');
        buttonElement.classList.add('bg-rose-600', 'border-rose-400', 'text-white');

        // Highlight correct button
        allButtons.forEach((b, i) => {
          if (questionData.options[i].correct) {
            b.classList.add('bg-emerald-600/70', 'border-emerald-400');
          }
        });

        quizFeedback.className = "block bg-rose-900/90 border-2 border-rose-400 text-rose-100 rounded-2xl p-4 text-center font-bold text-base md:text-lg transition-all";
        quizFeedback.innerHTML = `아쉬워요! 정답을 확인해보세요. ${questionData.explanation}`;
      }

      // Automatically proceed after 2.2 seconds
      setTimeout(() => {
        currentQuizIndex++;
        loadQuizQuestion(currentQuizIndex);
      }, 2300);
    }

    function showVictoryScreen() {
      playTone('victory');
      modalFinalScore.textContent = `${quizScore}점`;
      
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 100,
          origin: { y: 0.5 }
        });
      }

      winModal.classList.remove('hidden');
    }

    btnRestartQuiz.addEventListener('click', () => {
      playTone('pop');
      initQuiz();
    });

    btnBackToLab.addEventListener('click', () => {
      playTone('pop');
      winModal.classList.add('hidden');
      navModeExp.click();
    });

    // Initial canvas setup after DOM loads
    window.onload = function() {
      resizeLabCanvas();
      drawLab();
    };
  </script>
